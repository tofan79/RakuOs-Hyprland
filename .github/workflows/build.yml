name: Build and Push RakuOS Hyprland Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 4"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tofan79/rakuos-hyprland

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build PR smoke image
        if: github.event_name == 'pull_request'
        run: |
          podman build \
            --target ctx \
            -f Containerfile.nvidia \
            -t ghcr.io/${{ env.IMAGE_NAME }}:pr-smoke \
            .

      - name: Build NVIDIA image
        if: github.event_name != 'pull_request'
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          podman build \
            --build-arg RAKUOS_STAGING=1 \
            -f Containerfile.nvidia \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ghcr.io/${{ env.IMAGE_NAME }}:${DATE_TAG} \
            .

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          podman push ghcr.io/${{ env.IMAGE_NAME }}:latest
          podman push ghcr.io/${{ env.IMAGE_NAME }}:${DATE_TAG}

      - name: Cleanup old images (keep last 30 days)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE="rakuos-hyprland"
          OWNER="tofan79"
          CUTOFF=$(date -u -d "30 days ago" +%Y%m%d)

          echo "Today:  $(date -u +%Y%m%d)"
          echo "Cutoff: $CUTOFF"
          echo "Checking old package versions..."

          gh api \
            --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | [.id, (.metadata.container.tags // [])[]] | @tsv' |
          while IFS=$'\t' read -r VERSION_ID TAG; do

            # Jangan pernah hapus latest
            if [ "$TAG" = "latest" ]; then
              echo "Keeping: latest"
              continue
            fi

            # Hanya proses tag YYYYMMDD
            if [[ "$TAG" =~ ^[0-9]{8}$ ]]; then

              if [ "$TAG" -lt "$CUTOFF" ]; then
                echo "Deleting old tag: $TAG (version: $VERSION_ID)"

                gh api \
                  --method DELETE \
                  "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"

                echo "Deleted: $TAG"
              else
                echo "Keeping: $TAG"
              fi

            fi

          done

          echo "Cleanup done."
