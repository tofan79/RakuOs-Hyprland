name: Build and Push RakuOS Hyprland Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 00 * * 5"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tofan79/rakuos-hyprland

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # ============================================================
      # Pull Request
      # ============================================================
      - name: Build PR smoke image
        if: github.event_name == 'pull_request'
        run: |
          podman build \
            --target ctx \
            -f Containerfile.nvidia \
            -t ghcr.io/${{ env.IMAGE_NAME }}:pr-smoke \
            .

      # ============================================================
      # Main / Schedule / Manual
      # ============================================================
      - name: Build NVIDIA image
        if: github.event_name != 'pull_request'
        run: |
          DATE_TAG=$(date -u +%Y%m%d)

          podman build \
            --build-arg RAKUOS_STAGING=1 \
            -f Containerfile.nvidia \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ghcr.io/${{ env.IMAGE_NAME }}:${DATE_TAG} \
            .

      # ============================================================
      # Push image to GHCR
      # ============================================================
      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          DATE_TAG=$(date -u +%Y%m%d)

          podman push \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

          podman push \
            ghcr.io/${{ env.IMAGE_NAME }}:${DATE_TAG}

      # ============================================================
      # Cleanup images older than 30 days
      # latest is NEVER deleted
      # ============================================================
      - name: Cleanup old images (keep last 30 days)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE="rakuos-hyprland"
          CUTOFF=$(date -u -d "30 days ago" +%Y%m%d)

          echo "========================================"
          echo "GHCR Cleanup"
          echo "========================================"
          echo "Today:  $(date -u +%Y%m%d)"
          echo "Cutoff: $CUTOFF"
          echo ""

          echo "Getting GHCR package versions..."

          gh api \
            --paginate \
            "/user/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | [
              .id,
              (.metadata.container.tags // [])
            ] | @json' |
          while read -r VERSION; do

            VERSION_ID=$(echo "$VERSION" | jq -r '.[0]')
            TAGS=$(echo "$VERSION" | jq -r '.[1][]?')

            # ------------------------------------------------------
            # Kalau version ini punya tag latest,
            # JANGAN PERNAH hapus version tersebut.
            # ------------------------------------------------------
            if echo "$TAGS" | grep -qx "latest"; then
              echo "KEEP: version $VERSION_ID contains latest"
              continue
            fi

            # ------------------------------------------------------
            # Cek setiap tag tanggal
            # ------------------------------------------------------
            for TAG in $TAGS; do

              # Hanya proses format YYYYMMDD
              if [[ "$TAG" =~ ^[0-9]{8}$ ]]; then

                if [ "$TAG" -lt "$CUTOFF" ]; then

                  echo "DELETE: $TAG"
                  echo "       Version ID: $VERSION_ID"

                  gh api \
                    --method DELETE \
                    "/user/packages/container/${PACKAGE}/versions/${VERSION_ID}"

                  echo "       Deleted successfully"
                  echo ""

                else

                  echo "KEEP:   $TAG"

                fi

              fi

            done

          done

          echo ""
          echo "========================================"
          echo "Cleanup done."
          echo "========================================"
