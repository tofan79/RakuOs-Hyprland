name: Build and Push RakuOS Hyprland Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 4"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tofan79/rakuos-hyprland

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build NVIDIA image
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          podman build \
            --build-arg RAKUOS_STAGING=1 \
            -f Containerfile.nvidia \
            -v "$(pwd)":/run/src \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest.${DATE_TAG} \
            -t ghcr.io/${{ env.IMAGE_NAME }}:${DATE_TAG} \
            .

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          podman push ghcr.io/${{ env.IMAGE_NAME }}:latest
          podman push ghcr.io/${{ env.IMAGE_NAME }}:latest.${DATE_TAG}
          podman push ghcr.io/${{ env.IMAGE_NAME }}:${DATE_TAG}

      - name: Cleanup old images (keep last 3)
        if: github.event_name != 'pull_request'
        run: |
          echo "Listing current tags..."
          TAGS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/tags/list" | \
            jq -r '.tags[]' | sort -r)

          # Count date tags (format: YYYYMMDD) - skip :latest and latest.YYYYMMDD
          DATE_TAGS=$(echo "$TAGS" | grep -E "^[0-9]{8}$" | head -n 4)

          echo "Found date tags: $DATE_TAGS"

          # Keep only first 3, delete the rest
          KEEP=$(echo "$DATE_TAGS" | head -n 3)
          DELETE=$(echo "$DATE_TAGS" | tail -n +4)

          for TAG in $DELETE; do
            echo "Deleting old tag: $TAG"
            # Get manifest digest
            DIGEST=$(curl -s -I -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/$TAG" | \
              grep -i "docker-content-digest" | awk '{print $2}' | tr -d '\r')
            if [ -n "$DIGEST" ]; then
              curl -s -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/$DIGEST"
              echo "  Deleted $TAG (digest: $DIGEST)"
            fi
          done
          echo "Cleanup done. Kept tags: $KEEP"
