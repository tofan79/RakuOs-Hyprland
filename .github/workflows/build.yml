name: Build and Push RakuOS Hyprland Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tofan79/rakuos-hyprland

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build NVIDIA image
        run: |
          podman build \
            --build-arg RAKUOS_STAGING=1 \
            -f Containerfile.nvidia \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          podman push ghcr.io/${{ env.IMAGE_NAME }}:latest
          podman push ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
